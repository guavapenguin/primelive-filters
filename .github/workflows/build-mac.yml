name: build-mac
# 在 GitHub 的 macOS 雲端主機打包 primelive_filter.app + dmg(本地沒有 Mac 也能出貨)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build .app + dmg
        run: |
          export PYTHON=python3
          bash installer/mac/build_mac.sh

      - name: Smoke test bundle (import chain + graceful no-camera exit)
        run: |
          set +e
          BIN="engine/dist/primelive_filter.app/Contents/MacOS/primelive_filter"
          out1=$("$BIN" --list-cameras 2>&1); c1=$?
          echo "== list-cameras (exit $c1) =="; echo "$out1"
          out2=$("$BIN" --frames 1 --no-window 2>&1); c2=$?
          echo "== frames1 (exit $c2) =="; echo "$out2" | tail -5
          # 無攝影機環境:預期優雅退出(找不到攝影機),證明 numpy/cv2/mediapipe/PIL 全鏈可載入
          echo "$out2" | grep -q "找不到可用的攝影機" && echo "BUNDLE-OK" && exit 0
          echo "BUNDLE-FAIL"; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: primelive_mac_dmg
          path: engine/dist/primelive_mac.dmg
          retention-days: 14
